<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <form action="index5.html" method="post">
        <label for="nomeCompleto">Nome completo</label>
        <input type="text" id="nomeCompleto" name="nomeCompleto">
        <p>&nbsp;</p>

        <label>
            E-mail
            <input type="email" name="emailDoUsuario">
        </label>
        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento" name="dataNascimento">
        <p>&nbsp;</p>

        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade">
        <p>&nbsp;</p>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha">
        <p>&nbsp;</p>

        <label for="curriculo">Currículo</label>
        <input type="file" id="curriculo" name=",curriculo"
            accept=".pdf">
            <p>&nbsp;</p>

         <label for="telefone">Telefone</label>
         <input type="tel" id="telefone" name="telefone">
         <p>&nbsp;</p>

         <label for="link">Link</label>
         <input type="url" id="link" name="link">
         <p>&nbsp;</p>

         <label for="tempo">Tempo</label>
         <input type="time" id="tempo" name="tempo">
         <p>&nbsp;</p>

         <label for="dataHora">Data e Hora</label>
         <input type="datetime-local" id="dataHora" name="dataHora">
         <p>&nbsp;</p>

         <label for="mes">Mês</label>
         <input type="month" id="mes" name="mes">
         <p>&nbsp;</p>

         <label for="semana">Semana</label>
         <input type="week" id="semana" name="semana">
         <p>&nbsp;</p>

         <label for="cor">Cor</label>
         <input type="color" id="cor" name="cor">
         <p>&nbsp;</p>

         <label for="escala">Escala</label>
         <input type="range" id="escala" name="escala">
         <p>&nbsp;</p>
        
         <label for="pesquisa">Pesquisa</label>
         <input type="search" id="pesquisa" name="pesquisa">
         
         <!--Checkbox-->
         <p>Quais tecnologias você conhece?</p>
         <label>
            <input type="checkbox" name="tecnologia" value="html">
            HTML
         </label>
         <label>
            <input type="checkbox" name="tecnologia" value="css">
            CSS
         </label>
         <label>
            <input type="checkbox" name="tecnologia" value="js">
            JavaScript
         </label>
         <p>Qual é seu turno de estudo?</p>
         <label>
            <input type="radio" name="turno" value="manha">
            Manhã
         </label>
         <label>
            <input type="radio" name="turno" value="tarde">
            Tarde
         </label>
         <label>
            <input type="radio" name="turno" value="noite">
            Noite
         </label>

         <label for="curso">Curso</label>
         <select id="curso" name="curso">
            <option value="">Selecione...</option>
            <option value="informatica">Informática</option>
            <optgroup label="Gestão">
                <option value="adm">Administração</option>
                <option value="contabeis">Ciências Contabeis</option>
            </optgroup>
         </select>
         <label for="cidade"></label>
         <input- list="cidades" id="cidade" name="cidade">
         <datalist id="cidades">
            <option value="Chapecó">
            <option value="Joinville">
            <option value="Florianópolis">
         </datalist>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
