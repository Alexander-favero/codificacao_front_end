<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <!--Listas Não Numeradas / Não Ordenadas-->
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <!--Listas Numeradas / Ordenadas-->
    <ol>
        <li>Parênteses</li>
        <li>Divisão</li>
        <li>Multiplicação</li>
        <li>Adição</li>
        <li>Subtração</li>
    </ol>
    <!--<ol type=""></ol> Definir o tipo de marcador A, a, i, I, 1 -->
    <!--<ol start="2"></ol> Definir o número inicial da lista -->
    <!--<ol reversed></ol> Contagem descrescente -->
    <!-- Lista de Descrição (Glossário/FAQ)-->
     <dl>
        <dt>HTML</dt>
        <dd>Linguagem de Marcação de Hipertexto que estrutura o conteúdo</dd>

        <dt>CSS</dt>
        <dd>Linguagem de Estilo que define a aparência</dd>
     </dl>
     <!--Exemplo de Menu-->
     <nav aria-label="Menu Principal">
        <ul>
            <li><a href="#inicio">Início</a></li>
            <li><a href="#sobre">Sobre</a></li>




            
        </ul>
     </nav>
</body>
</html>
